name: Secret Scan (gitleaks)

# Blocks secrets from entering the repo. On PRs it scans the PR commits; on
# pushes it scans the pushed commits. Free for user-owned repos (no license).
# Anon/publishable Supabase keys are public by design (RLS-protected) — if a
# scan flags one, add it to .gitleaksignore with a comment, don't hide a real secret.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # WORKING-TREE SCAN (added for board row ten-projects-can-have-a-password-committed-unnoticed).
      # The gitleaks-action step above scans only the COMMIT RANGE of the event, so a secret
      # already sitting in a file (introduced by a merge, or pushed straight to the default
      # branch) is reported as "no leaks". This step scans the files as they stand.
      # `if: always()` is load-bearing: without it a failing range scan would SKIP this step,
      # hiding whatever the tree holds on the very commit meant to prove it.
      - name: gitleaks (working tree, BLOCKING)
        if: always()
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          if [ -f .gitleaks.toml ]; then
            echo "Using repo config .gitleaks.toml"
            /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact -v --exit-code 1
          else
            echo "::warning::.gitleaks.toml is absent - scanning with gitleaks' built-in rules. A missing config must not be reported as a leak."
            /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
          fi
